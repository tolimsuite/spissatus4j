name: Publish to GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish current version to GitHub Packages
    if: github.repository == 'tolimsuite/spissatus4j'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*spissatusVersion[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" settings.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::No spissatusVersion found in settings.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew publishAllPublicationsToGithubRepository
          --no-daemon --no-parallel --stacktrace

      - name: Verify published packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ARTIFACTS="spissatus4j-contract spissatus4j-core spissatus4j-crypto spissatus4j-key
            spissatus4j-envelope spissatus4j-policy spissatus4j-bouncycastle spissatus4j-gm
            spissatus4j-spring-boot-starter"
          for ARTIFACT in $ARTIFACTS; do
            URL="https://maven.pkg.github.com/tolimsuite/spissatus4j/cn/tolim/spissatus4j/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}.pom"
            curl --location --silent --show-error --fail \
              --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
              "$URL" --output "/tmp/${ARTIFACT}.pom"
            grep -q "<version>${VERSION}</version>" "/tmp/${ARTIFACT}.pom"
            echo "Verified ${ARTIFACT}:${VERSION}"
          done